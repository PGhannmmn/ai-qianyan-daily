# AI 前沿情报局 — Phase 4.5 manual dry-run only.
name: Daily AI News Digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate research + LLM + QA only (no publication)"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$REQUESTED_MODE" != "dry-run" ]; then
            echo "Only dry-run is enabled. Publication requires separate approval."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify standalone pipeline dependencies
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "pipeline")
          import daily
          daily._load_full_pipeline()
          PY

      - name: Run pipeline dry-run
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          python pipeline/daily.py --date "$(date -u +%F)" --out site \
            --base-url https://pghannmmn.github.io/ai-qianyan-daily/ \
            --llm --dry-run

      - name: Verify checkout unchanged
        if: always()
        run: |
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

